apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: expenses-tracker

resources:
  - ../../base
  - certificate.yaml
  - ingress.yaml

# Single source of truth for the deployed backend version.
# Keep in sync with `version` in build.gradle.kts (the tag CI pushes).
images:
  - name: xavierclavel/expenses-tracker-backend
    newTag: "1.3.3"
