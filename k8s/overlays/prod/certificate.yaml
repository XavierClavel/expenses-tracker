apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bankable-xavier-cl
spec:
  secretName: bankable-xavier-cl-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "bankable.xavier.cl"
  dnsNames:
    - "bankable.xavier.cl"
---
