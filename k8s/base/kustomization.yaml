apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: expenses-tracker

resources:
  - namespace.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - backend/nodeport.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  - postgres/pvc.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - redis/pvc.yaml

# includeSelectors is false on purpose: Deployment .spec.selector is immutable,
# so stamping extra labels into it would break `apply` on the live workloads.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: expenses-tracker
