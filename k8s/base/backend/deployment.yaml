apiVersion: apps/v1
kind: Deployment
metadata:
  name: expenses-tracker-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expenses-tracker-backend
  template:
    metadata:
      labels:
        app: expenses-tracker-backend
    spec:
      containers:
        - name: backend
          image: xavierclavel/expenses-tracker-backend:latest
          imagePullPolicy: Always
          command: ["java", "-jar", "/app/backend.jar"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: expenses-tracker-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
