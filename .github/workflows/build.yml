name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backend-docker-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.meta.outputs.should_deploy }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version & decide whether to deploy
        id: meta
        run: |
          VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' build.gradle.kts | head -n1)
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — deploying $TAG regardless of existing tag."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already exists — version unchanged, skipping deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $TAG — will deploy."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Gradle build
        run: ./gradlew clean build --no-daemon

      - name: List subprojects
        run: ./gradlew projects

      - name: Build and push images
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for project in $(find . -name Dockerfile -exec dirname {} \;); do
            project=$(basename $project)
            echo "Building Docker image for $project..."
            docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/expenses-tracker-$project:${VERSION} $project
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/expenses-tracker-$project:${VERSION}
            docker tag ${{ secrets.DOCKERHUB_USERNAME }}/expenses-tracker-$project:${VERSION} ${{ secrets.DOCKERHUB_USERNAME }}/expenses-tracker-$project:latest
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/expenses-tracker-$project:latest
          done

      - name: Tag version & create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git rev-parse "refs/tags/${{ needs.check.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ needs.check.outputs.tag }} already exists — skipping release."
          else
            gh release create "${{ needs.check.outputs.tag }}" \
              --title "Release ${{ needs.check.outputs.version }}" \
              --notes "Release created automatically by GitHub Actions." \
              --target "${{ github.sha }}"
          fi

  deploy:
    needs: [check, build]
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      # Rendering here rather than on the node means what gets applied is exactly
      # this commit's manifests — no checkout to keep in sync on the server.
      - name: Render manifests
        run: |
          kubectl kustomize k8s/overlays/prod > manifests.yaml
          echo "Rendered $(grep -c '^kind:' manifests.yaml) resources:"
          grep -E '^(kind|  name):' manifests.yaml | paste - -

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Apply manifests
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            'kubectl apply -f -' < manifests.yaml

      # :latest is republished by the build job, but the Deployment spec is
      # unchanged, so apply alone would not restart anything.
      - name: Redeploy :latest and wait for rollout
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" bash -eu <<'REMOTE'
            kubectl rollout restart -n expenses-tracker deployment/expenses-tracker-backend
            kubectl rollout status  -n expenses-tracker deployment/expenses-tracker-backend --timeout=5m
            kubectl get pods -n expenses-tracker -l app=expenses-tracker-backend
          REMOTE
